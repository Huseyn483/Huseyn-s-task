<!DOCTYPE html>
<html>
<head>
    <title>Contact</title>
</head>
<body>

    <h1>Contact</h1>

    <form>

        <label>First name:<br> <input type="text"> </label><br><br>

        <label>Last name:<br>  <input type="text"> </label><br><br>

        <label>Phone:<br>  <input type="text"> </label><br><br>

        <label>Date and time:</label><br><br>

        <label>Day: <input type="text" size="5">  </label>

        <label>Month:
            <select>
                <option>January</option>
                <option>February</option>
                <option>March</option>
            </select>
        </label>

        <label>Year: <input type="text" size="5">  </label>

        <label>Time: <input type="time">  </label>

        <br><br>
        <label>Seating preference:</label><br>
        <label> <input type="radio" name="seat"> Indoor </label><br>
        <label> <input type="radio" name="seat"> Outdoor </label><br><br>

        <label>Additional requests:<br> <input type="text"> </label><br><br>

        <label>
            <input type="checkbox"> Yes, subscribe me to your newsletter. </label><br><br>

        <button type="submit">Request booking</button>
    </form>
</body>
</html>
